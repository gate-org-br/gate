<!DOCTYPE HTML>

<html lang="pt-BR">

	<head>
		<meta charset="UTF-8">
		<title>Gate</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel='stylesheet' type='text/css' href='./gate/Gate.css' />
		<script type='module' src='./gate/g-code-viewer.js' charset="utf-8"></script>
		<script type='module' src='./gate/Gate.js' charset="utf-8"></script>
		<script type='module' src='./gate/g-grid.js' charset="utf-8"></script>
	</head>

	<body data-loading onload="document.body.removeAttribute('data-loading')">

		<main>
			<header>
				<img src='./gate/gate.svg' alt="Gate logo"/>
				<label>Gate</label>
				<label>Version 1.0.0-SNAPSHOT</label>
			</header>

			<nav>
				<g-tabbar>
					<a id='targets' href='/target/view.html' target="@inner-html(section)">
						Targets<g-icon>&#X1011;</g-icon>
					</a>
					<a id='components' href='/component/view.html' target="@inner-html(section)">
						<g-icon>&#X2178;</g-icon>Components
					</a>
					<hr />
					<a id="reload" href="/main.html">
						Reload<g-icon>&#X2025;</g-icon>
					</a>
					<a href='./login.html'>Sair<g-icon>&#X2007;</g-icon></a>
				</g-tabbar>
			</nav>
			<section>
				<g-digital-clock value="0" paused>

				</g-digital-clock>

				<g-coolbar>
					<a id="pause" href="#">
						Ativar
					</a>
					<a id="reset" href="#">
						Reset
					</a>
					<a id="blank" href="#">
						blank
					</a>
				</g-coolbar>
				<script type="module">
					const pause = document.getElementById("pause");
					const blank = document.getElementById("blank");
					const reset = document.getElementById("reset");
					const clock = document.querySelector("g-digital-clock");
					pause.addEventListener("click", () =>
					{
						clock.paused = !clock.paused;
						pause.innerHTML = clock.paused ? "Ativar" : "Pausar";

					});

					blank.addEventListener("click", () => clock.value = null);
					reset.addEventListener("click", () => clock.value = 0);
				</script>

				<!--				<g-desk-pane>
									<a href='/target/view.html' target="@inner-html(section)" aria-selected>
										Targets<g-icon>&#X1011;</g-icon>
									</a>
									<a href='/component/view.html' target="@inner-html(section)">
										<g-icon>&#X2178;</g-icon>Components
									</a>
								</g-desk-pane>-->
			</section>

			<footer>
				<label>Foo</label>
				<label>Bar</label>
			</footer>
		</main>
	</body>
</html>
